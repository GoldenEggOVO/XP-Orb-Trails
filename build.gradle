plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"xporbtrails" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	testImplementation sourceSets.client.output
	testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'

}

test {
	useJUnitPlatform()
}

if (project.hasProperty('clientTests')) {
	fabricApi.configureTests {
		createSourceSet = true
		modId = 'xporbtrails-client-tests'
		enableGameTests = false
		enableClientGameTests = true
	}
	dependencies {
		gametestImplementation sourceSets.client.output
		gametestImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	}
}

processResources {
	def metadata = [version: "${project.version}+mc${project.minecraft_version}",
		minecraft_version: project.minecraft_version,
		loader_version: project.loader_version,
		fabric_api_version: project.fabric_api_version]
	inputs.properties metadata
	filesMatching("fabric.mod.json") {
		expand metadata
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "fabric-${project.version}+${project.minecraft_version}"
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

def releaseJarTask = tasks.named('jar')
tasks.register('verifyReleaseJar') {
	dependsOn releaseJarTask
	doLast {
		def releaseJar = releaseJarTask.get().archiveFile.get().asFile
		def requiredEntries = [
			'dev/goldeneggovo/xporbtrails/TrailConfigScreen.class',
			'dev/goldeneggovo/xporbtrails/ModMenuIntegration.class',
			'dev/goldeneggovo/xporbtrails/mixin/RenderPipelinesAccessor.class',
			'dev/goldeneggovo/xporbtrails/mixin/ClientPacketListenerMixin.class',
			'assets/xporbtrails/lang/en_us.json',
			'assets/xporbtrails/lang/zh_cn.json'
		]
		new java.util.zip.ZipFile(releaseJar).withCloseable { zip ->
			requiredEntries.each { entry ->
				if (zip.getEntry(entry) == null) {
					throw new GradleException("Release JAR is missing ${entry}: ${releaseJar}")
				}
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyReleaseJar')
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
