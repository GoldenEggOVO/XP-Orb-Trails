name: Replace v1.0.1 release

on:
  push:
    tags: [v1.0.1]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - name: Replace release asset and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=build/libs/xp-orb-trails-1.0.1+mc26.2.jar
          test -f "$asset"
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null
          sha=$(sha256sum "$asset" | cut -d' ' -f1)
          gh release upload v1.0.1 "$asset" --clobber --repo "$GITHUB_REPOSITORY"

          mkdir -p "$RUNNER_TEMP/release-verify"
          gh release download v1.0.1 --pattern 'xp-orb-trails-1.0.1+mc26.2.jar' \
            --dir "$RUNNER_TEMP/release-verify" --repo "$GITHUB_REPOSITORY"
          downloaded=$(sha256sum "$RUNNER_TEMP/release-verify/xp-orb-trails-1.0.1+mc26.2.jar" | cut -d' ' -f1)
          test "$downloaded" = "$sha"

          temporary=xp-orb-trails-1.0.1+mc26.2-goldeneggovo.jar
          if gh release view v1.0.1 --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY" | grep -Fxq "$temporary"; then
            gh release delete-asset v1.0.1 "$temporary" --yes --repo "$GITHUB_REPOSITORY"
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          XP Orb Trails 1.0.1 for Minecraft 26.2.

          ### Fixes
          - Fixed the incomplete original v1.0.0 release package that prevented trail settings from being edited. You can now change trail settings using Mod Menu's Config button or the Open Trail Settings key binding.
          - Built-in color presets now follow Minecraft's selected language. English is used when a translation is unavailable.
          - Newly saved preset and profile names use the selected language when created.
          - Updated the mod author and Java package namespace to GoldenEggOVO. The mod ID and configuration path are unchanged.

          ### Requirements
          - Minecraft 26.2
          - Fabric Loader 0.19.5 or newer
          - Fabric API 0.158.0+26.2 or newer
          - Java 25 or newer
          - Mod Menu is optional, but provides the Config button.

          This is a client-only mod; the server does not need it.
          EOF
          printf '\nUpdated v1.0.1 JAR SHA-256: `%s`. Re-download the JAR if you obtained v1.0.1 before this correction.\n' "$sha" >> "$RUNNER_TEMP/release-notes.md"
          gh release edit v1.0.1 --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
