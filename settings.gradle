pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}
rootProject.name = 'xp-orb-trails'
include 'common'
providers.gradleProperty('loaders').orElse('fabric,forge,neoforge').get().split(',').each { loader ->
    if (!(loader in ['fabric', 'forge', 'neoforge'])) throw new GradleException("Unknown loader: ${loader}")
    include loader
}
